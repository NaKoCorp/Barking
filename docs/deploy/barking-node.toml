# Configuration de barking-node. Toute clé absente prend la valeur par défaut
# de la spécification (indiquée en commentaire) ; une clé inconnue est une
# erreur au démarrage.

# Adresses d'écoute UDP (QUIC). `[::]` accepte aussi l'IPv4 sous Linux quand
# net.ipv6.bindv6only=0 (réglage habituel) ; sinon liste les deux familles :
# listen = ["0.0.0.0:4433", "[::]:4433"]
listen = ["[::]:4433"]

# Dossier de données : node.key (mode 0600) et node.db. Créé par `init`.
data_dir = "/var/lib/barking-node"

# Plafond d'octets gardés (paquets + accusés). Défaut : 1 Gio.
# storage_max_bytes = 1073741824
# Petit appareil (Raspberry Pi, carte SD) : 256 Mio.
# storage_max_bytes = 268435456

# Difficulté de base de la preuve de travail, de 1 à 24 bits. Défaut : 18.
pow_bits = 18

# Connexions simultanées : au total (défaut 1 000) et par adresse IP, par
# préfixe /64 en IPv6 (défaut 8).
# max_connections = 1000
# max_connections_per_ip = 8
# Plafonds par préfixe plus large : IPv6 /56 (32) et /48 (64), IPv4 /24 (32).
# Table pleine : la connexion la plus longtemps inactive du /48 ou /24 le plus
# représenté cède sa place.
# max_connections_per_ipv6_56 = 32
# max_connections_per_ipv6_48 = 64
# max_connections_per_ipv4_24 = 32
# Petit appareil : max_connections = 200

# Mémoire des réponses : octets de réponses en vol, tous pairs confondus
# (défaut 64 Mio ; la mémoire réelle vaut environ le double), et par adresse
# (défaut 4 Mio, au moins 1 Mio).
# max_response_bytes_in_flight = 67108864
# max_response_bytes_per_ip = 4194304
# Petit appareil (Raspberry Pi avec 1 Gio de mémoire) :
# max_response_bytes_in_flight = 16777216
# max_response_bytes_per_ip = 2097152

# Opérations de base simultanées ou en attente (défaut 64). Au-delà : RateLimited.
# max_db_jobs = 64
# Part de cette file par /64 ou /32 : max_db_jobs / 16 ; par /48 ou /24 :
# max_db_jobs / 8 par défaut, réglable :
# max_db_jobs_per_prefix = 8
# Petit appareil : max_db_jobs = 16

# Débit minimal attendu d'un lecteur, en octets/s (défaut 32 Kio/s). Il allonge
# l'échéance d'écriture d'une réponse de taille / débit, au plus 60 s.
# min_send_rate = 32768

# Période des journaux agrégés, en secondes (défaut 60).
# log_interval_secs = 60
