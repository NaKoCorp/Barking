# barking-node configuration. Any missing key takes the default value
# of the specification (given in a comment); an unknown key is an
# error at startup.

# UDP listen addresses (QUIC). `[::]` also accepts IPv4 on Linux when
# net.ipv6.bindv6only=0 (the usual setting); otherwise list both families:
# listen = ["0.0.0.0:4433", "[::]:4433"]
listen = ["[::]:4433"]

# Data directory: node.key (mode 0600) and node.db. Created by `init`.
data_dir = "/var/lib/barking-node"

# Cap on stored bytes (packets + acknowledgements). Default: 1 GiB.
# storage_max_bytes = 1073741824
# Small device (Raspberry Pi, SD card): 256 MiB.
# storage_max_bytes = 268435456

# Base difficulty of the proof of work, from 1 to 24 bits. Default: 18.
pow_bits = 18

# Simultaneous connections: in total (default 1,000) and per IP address, per
# /64 prefix for IPv6 (default 8).
# max_connections = 1000
# max_connections_per_ip = 8
# Caps per wider prefix: IPv6 /56 (32) and /48 (64), IPv4 /24 (32).
# Full table: the longest-idle connection of the most represented /48 or /24
# gives up its place.
# max_connections_per_ipv6_56 = 32
# max_connections_per_ipv6_48 = 64
# max_connections_per_ipv4_24 = 32
# Small device: max_connections = 200

# Response memory: bytes of in-flight responses, all peers combined
# (default 64 MiB; the actual memory is about double), and per address
# (default 4 MiB, at least 1 MiB).
# max_response_bytes_in_flight = 67108864
# max_response_bytes_per_ip = 4194304
# Small device (Raspberry Pi with 1 GiB of memory):
# max_response_bytes_in_flight = 16777216
# max_response_bytes_per_ip = 2097152

# Simultaneous or pending base operations (default 64). Beyond that: RateLimited.
# max_db_jobs = 64
# Share of this queue per /64 or /32: max_db_jobs / 16; per /48 or /24:
# max_db_jobs / 8 by default, adjustable:
# max_db_jobs_per_prefix = 8
# Small device: max_db_jobs = 16

# Minimum throughput expected from a reader, in bytes/s (default 32 KiB/s). It extends
# the write deadline of a response by size / throughput, at most 60 s.
# min_send_rate = 32768

# Period of the aggregated logs, in seconds (default 60).
# log_interval_secs = 60

# Hash table between nodes (S/Kademlia). Without `public_addr`, the table is
# disabled: the node remains a simple relay and answers `Unsupported` to the
# table's requests.
# [dht]
# One or two public addresses (IPv4 and/or IPv6, with the listen port),
# published in the node's signed record.
# public_addr = ["203.0.113.7:4433", "[2001:db8::7]:4433"]
# Additional bootstrap nodes `identifier@address:port`, tried after
# the list built into the binary.
# bootstrap = []
# Accepts non-routable addresses, for peers and push relays alike: tests
# and local networks only.
# allow_private_addrs = false
# Cap on outgoing replication to the other responsible nodes, in bytes per
# hour. Default: 512 MiB. Small device (Raspberry Pi): 128 MiB.
# replication_bytes_per_hour = 134217728

# Wake-ups for iOS background reception (spec iOS push, §3). The node keeps
# wake subscriptions (at most 4 per mailbox) and, when a message arrives for a
# subscribed mailbox, hands the sealed token to the push relay it names
# (barking-push). Tokens are sealed for the relay: the node learns no device.
# [wake]
# Accept subscriptions and send wake-ups. Default: true.
# enabled = true
# Global cap on stored subscriptions. Default: 1,000,000.
# Small device: max_subscriptions = 100000
# max_subscriptions = 1000000
