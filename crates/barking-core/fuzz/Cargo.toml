[package]
name = "barking-core-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
rand = "0.10.3"
tempfile = "3.20.0"

[lib]
name = "barking_core_fuzz"
path = "src/lib.rs"

[dependencies.barking-core]
path = ".."

[[bin]]
name = "packet_decode"
path = "fuzz_targets/packet_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "reassemble"
path = "fuzz_targets/reassemble.rs"
test = false
doc = false
bench = false

[[bin]]
name = "receive"
path = "fuzz_targets/receive.rs"
test = false
doc = false
bench = false

[[bin]]
name = "receive_frame"
path = "fuzz_targets/receive_frame.rs"
test = false
doc = false
bench = false

# Pas une cible de fuzzing : écrit le corpus initial.
[[bin]]
name = "seed"
path = "src/seed.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
