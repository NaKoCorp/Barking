[package]
name = "barking-core-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
postcard = { version = "1.1.3", features = ["alloc"] }
rand = "0.10.3"
tempfile = "3.20.0"

[lib]
name = "barking_core_fuzz"
path = "src/lib.rs"

[dependencies.barking-core]
path = ".."

[dependencies.barking-proto]
path = "../../barking-proto"

[dependencies.barking-dht]
path = "../../barking-dht"

[dependencies.tokio]
version = "1.54.1"
default-features = false
features = ["rt"]

[[bin]]
name = "packet_decode"
path = "fuzz_targets/packet_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "reassemble"
path = "fuzz_targets/reassemble.rs"
test = false
doc = false
bench = false

[[bin]]
name = "receive"
path = "fuzz_targets/receive.rs"
test = false
doc = false
bench = false

[[bin]]
name = "receive_frame"
path = "fuzz_targets/receive_frame.rs"
test = false
doc = false
bench = false

# Decoding arbitrary bytes as a request frame must never panic.
# Run: cd crates/barking-core/fuzz && cargo fuzz run proto_frame
[[bin]]
name = "proto_frame"
path = "fuzz_targets/proto_frame.rs"
test = false
doc = false
bench = false

# Filtering an arbitrary `Nodes` response must never panic.
# Run: cd crates/barking-core/fuzz && cargo fuzz run dht_response
[[bin]]
name = "dht_response"
path = "fuzz_targets/dht_response.rs"
test = false
doc = false
bench = false

# Decoding arbitrary link files (offer, request, bundle, history archive)
# must never panic.
# Run: cd crates/barking-core/fuzz && cargo fuzz run link_files
[[bin]]
name = "link_files"
path = "fuzz_targets/link_files.rs"
test = false
doc = false
bench = false

# Decoding an arbitrary contact card (text form or stored bytes) must never
# panic.
# Run: cd crates/barking-core/fuzz && cargo fuzz run card_text
[[bin]]
name = "card_text"
path = "fuzz_targets/card_text.rs"
test = false
doc = false
bench = false

# Not a fuzzing target: writes the initial corpus.
[[bin]]
name = "seed"
path = "src/seed.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
