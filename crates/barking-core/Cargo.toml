[package]
name = "barking-core"
version = "0.1.0"
edition = "2024"

[dependencies]
bip39 = "3.0.0"
blake3 = "1.8.7"
chacha20poly1305 = "0.11.0"
data-encoding = "2.11.1"
ed25519-dalek = "3.0.0"
hkdf = "0.13.0"
hmac = "0.13.0"
ml-kem = { version = "0.3.3", features = ["zeroize"] }
postcard = { version = "1.1.3", features = ["alloc"] }
rand_core = "0.10.1"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
x25519-dalek = { version = "3.0.0", features = ["static_secrets", "zeroize"] }
zeroize = { version = "1.9.1", features = ["derive"] }

[dev-dependencies]
hex-literal = "1.1.0"
rand = "0.10.3"
