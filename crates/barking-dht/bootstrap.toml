# Bootstrap list built into the binary: public nodes tried at startup
# when fewer than 3 nodes from `peers` respond, before the config's `bootstrap`.
# Format: one "<base32 identifier>@<ip:port>" entry per node, for example
#   nodes = [
#     "<identifier>@203.0.113.7:4433",
#     "<identifier>@[2001:db8::7]:4433",
#   ]
# Empty as long as no public node exists; the maintainer fills it in at the
# first launch.
nodes = []
