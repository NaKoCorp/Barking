[package]
name = "barking-push"
version.workspace = true
edition = "2024"
license.workspace = true
publish.workspace = true

[[bin]]
name = "barking-push"
path = "src/main.rs"

[features]
# Lets `ApnsPusher::new_insecure_for_tests` talk cleartext HTTP/2 to a fake
# APNs. Never enabled by production builds.
test-apns = []

[dependencies]
clap.workspace = true
p256 = { workspace = true, features = ["ecdsa", "pkcs8", "pem"] }
rand.workspace = true
reqwest = { workspace = true, features = ["http2", "rustls-no-provider"] }
rustls.workspace = true
rustls-native-certs.workspace = true
tracing-subscriber.workspace = true
barking-proto.workspace = true
blake3.workspace = true
data-encoding.workspace = true
ed25519-dalek.workspace = true
quinn.workspace = true
serde.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true
x25519-dalek.workspace = true
zeroize.workspace = true
tokio = { workspace = true, features = ["rt", "time", "sync", "macros", "rt-multi-thread", "signal", "net"] }

[dev-dependencies]
rand.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "time", "sync", "macros"] }
barking-push = { path = ".", features = ["test-apns"] }
http-body-util.workspace = true
hyper = { workspace = true, features = ["server", "http2"] }
hyper-util = { workspace = true, features = ["tokio"] }
