name: ci

# Pull request checks. Build reproducibility: double build on pull requests
# that change the build environment, full double build of every target on
# demand (workflow_dispatch), and at release time (release.yml).
# A push to main does not replay what its pull request already validated: the
# gate job skips the checks when the merged tree is the tested tree and that
# run was green (scripts/ci-gate.sh). Those runs then only fill the Cargo
# caches that pull requests start from. Any doubt runs the full CI.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A new push to a pull request replaces the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  # Decides whether the checks below run (scripts/ci-gate.sh). It always exits
  # 0; the checks run unless it says run=false, so a failure of this job
  # itself (no output) can never skip them.
  gate:
    name: gate
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Was this tree already validated by its pull request?
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci-gate.sh >> "$GITHUB_OUTPUT"

  # Always reports (a required check): skipped steps when the pull request
  # leaves the build environment untouched.
  repro-twice:
    name: double build (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Does the pull request change the build environment?
        id: env
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --quiet "$BASE" HEAD -- \
            Cargo.lock ':(glob)**/Cargo.toml' ':(glob)**/build.rs' rust-toolchain.toml \
            .cargo/ docker/ .xcode-version scripts/repro-build.sh scripts/release-lib.sh \
            scripts/tests/repro-twice.sh scripts/compare-copies.sh \
            .github/workflows/ci.yml .github/workflows/release.yml .github/workflows/repro-build.yml \
            .github/actions/
          then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "build environment unchanged: double build skipped"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Two builds, two paths, same checksums
        if: steps.env.outputs.changed == 'true'
        run: scripts/tests/repro-twice.sh

  rust:
    name: Rust checks (fmt, clippy, tests)
    needs: gate
    # Also runs when the gate job failed (no output): only run=false skips.
    if: ${{ !cancelled() && needs.gate.outputs.run != 'false' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Toolchain pinned by rust-toolchain.toml, installed explicitly (rustup is on the Ubuntu runners).
      - uses: $/.github/actions/rust-toolchain
        with:
          components: rustfmt clippy
      # Only GitHub-owned actions are allowed in this repository: the Cargo
      # cache uses actions/cache, keyed by toolchain and lockfile.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-
      # Official cargo-nextest release, pinned by version and checksum.
      - name: Install cargo-nextest
        env:
          VERSION: 0.9.149
          SHA256: 32d1d8c0567b7a80bee2bad8bb09125c846da96bc009b2de11ec08557290c770
        run: |
          set -euo pipefail
          archive="cargo-nextest-$VERSION-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-$VERSION/$archive"
          echo "$SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$HOME/.cargo/bin"
      - run: scripts/check.sh --full

  # Security checks of a public repository (scripts/security-check.sh, the
  # same ones as the git hooks): credential files, gitleaks, shellcheck, trivy
  # (HIGH and CRITICAL fail), cargo-deny, zizmor and actionlint.
  security:
    name: security (secrets, vulnerabilities, licenses, workflows)
    needs: gate
    # Also runs when the gate job failed (no output): only run=false skips.
    if: ${{ !cancelled() && needs.gate.outputs.run != 'false' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # cargo-deny reads the dependency graph with cargo.
      - uses: $/.github/actions/rust-toolchain
      # Official releases, pinned by version and checksum (GitHub's asset
      # digest, equal to the project's own checksum file where it has one).
      - name: Install the scanners
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          fetch() { # repo tag asset sha256
            curl -fsSL -o "$RUNNER_TEMP/$3" "https://github.com/$1/releases/download/$2/$3"
            echo "$4  $RUNNER_TEMP/$3" | sha256sum -c -
          }
          fetch gitleaks/gitleaks v8.30.1 gitleaks_8.30.1_linux_x64.tar.gz \
            551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          tar -xzf "$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz" -C "$bin" gitleaks
          fetch aquasecurity/trivy v0.76.1 trivy_0.76.1_Linux-64bit.tar.gz \
            c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
          tar -xzf "$RUNNER_TEMP/trivy_0.76.1_Linux-64bit.tar.gz" -C "$bin" trivy
          fetch EmbarkStudios/cargo-deny 0.20.2 cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz \
            9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
          tar -xzf "$RUNNER_TEMP/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz" -C "$bin" \
            --strip-components=1 cargo-deny-0.20.2-x86_64-unknown-linux-musl/cargo-deny
          fetch zizmorcore/zizmor v1.31.1 zizmor-x86_64-unknown-linux-gnu.tar.gz \
            d185f726bdaf92df78273217dfdd24ebcd6b0ef48cf3ce776ff5762b6e138c99
          tar -xzf "$RUNNER_TEMP/zizmor-x86_64-unknown-linux-gnu.tar.gz" -C "$bin" zizmor
          fetch rhysd/actionlint v1.7.12 actionlint_1.7.12_linux_amd64.tar.gz \
            8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          tar -xzf "$RUNNER_TEMP/actionlint_1.7.12_linux_amd64.tar.gz" -C "$bin" actionlint
          fetch koalaman/shellcheck v0.11.0 shellcheck-v0.11.0.linux.x86_64.tar.xz \
            8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
          tar -xJf "$RUNNER_TEMP/shellcheck-v0.11.0.linux.x86_64.tar.xz" -C "$bin" \
            --strip-components=1 shellcheck-v0.11.0/shellcheck
          echo "$bin" >> "$GITHUB_PATH"
      - name: Security checks
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            scripts/security-check.sh --range "$BASE..HEAD"
          else
            scripts/security-check.sh --all
          fi

  # iOS app (spec iOS foundations §7): XCFramework, app and extension build,
  # XCTest on a simulator. Skipped steps (green job) when the pull request
  # touches neither the app nor the Rust code it wraps.
  apple:
    name: iOS app (build, XCTest)
    needs: gate
    # Also runs when the gate job failed (no output): only run=false skips.
    if: ${{ !cancelled() && needs.gate.outputs.run != 'false' }}
    runs-on: macos-26
    # Serial UI tests with one retry: room for a couple of 60 s hangs.
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Does the change touch the iOS app?
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ] || ! git diff --quiet "$BASE" HEAD -- \
            apple/ crates/ Cargo.lock Cargo.toml rust-toolchain.toml .xcode-version \
            scripts/build-xcframework.sh .github/workflows/ci.yml
          then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "iOS app untouched: build skipped"
          fi
      - name: Select the pinned Xcode
        if: steps.paths.outputs.changed == 'true'
        uses: $/.github/actions/select-xcode
      - name: Install the pinned Rust toolchain
        if: steps.paths.outputs.changed == 'true'
        uses: $/.github/actions/rust-toolchain
        with:
          targets: aarch64-apple-ios-sim
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.paths.outputs.changed == 'true'
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-ios-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-ios-${{ hashFiles('rust-toolchain.toml') }}-
      # Official XcodeGen release, pinned by version and checksum.
      - name: Install XcodeGen
        if: steps.paths.outputs.changed == 'true'
        env:
          VERSION: 2.46.0
          SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$VERSION/xcodegen.zip"
          echo "$SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Build the XCFramework (simulator slice)
        if: steps.paths.outputs.changed == 'true'
        run: scripts/build-xcframework.sh --sim-only
      - name: Build the app once
        if: steps.paths.outputs.changed == 'true'
        run: scripts/test-ios.sh build
      - name: Unit tests
        if: steps.paths.outputs.changed == 'true'
        run: scripts/test-ios.sh unit
      # One simulator: the 3-core runner cannot boot clones (they never got
      # their runner launched and starved the first one into timeouts). A
      # failed test gets one more try; the result bundle keeps both.
      - name: UI tests
        if: steps.paths.outputs.changed == 'true'
        env:
          BARKING_UI_WORKERS: 1
          BARKING_UI_RETRIES: 1
        run: scripts/test-ios.sh ui
      - name: Keep the UI test result
        if: steps.paths.outputs.changed == 'true' && failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-tests
          path: apple/build/ui.xcresult
          retention-days: 3
          if-no-files-found: ignore
      - name: Localised tour (English)
        if: steps.paths.outputs.changed == 'true'
        run: scripts/test-ios.sh tour en
      - name: Keep the tour result
        if: steps.paths.outputs.changed == 'true' && always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tour-en
          path: apple/build/tour-en.xcresult
          retention-days: 3
          if-no-files-found: ignore

  release-scripts:
    name: release scripts
    needs: gate
    # Also runs when the gate job failed (no output): only run=false skips.
    if: ${{ !cancelled() && needs.gate.outputs.run != 'false' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/tests/release-scripts.sh
      - run: bash scripts/tests/ci-scripts.sh
      # Deployment set-up (fake docker) and compose file of deploy/.
      - run: scripts/tests/stack-init.sh
      - run: scripts/tests/compose-config.sh

  # Cargo cache warm-up when main skipped its checks: same paths and key as
  # the rust job, saved only when that key is missing.
  cache:
    name: Cargo cache (Linux)
    needs: gate
    if: github.event_name == 'push' && needs.gate.outputs.run == 'false'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Is the cache already there?
        id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          lookup-only: true
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
      - if: steps.restore.outputs.cache-hit != 'true'
        uses: $/.github/actions/rust-toolchain
      - if: steps.restore.outputs.cache-hit != 'true'
        run: cargo build --workspace --all-targets --locked
      - if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}

  # Same warm-up for the iOS job (simulator slice of the Rust code).
  cache-ios:
    name: Cargo cache (iOS)
    needs: gate
    if: github.event_name == 'push' && needs.gate.outputs.run == 'false'
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Is the cache already there?
        id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          lookup-only: true
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-ios-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
      - if: steps.restore.outputs.cache-hit != 'true'
        uses: $/.github/actions/select-xcode
      - if: steps.restore.outputs.cache-hit != 'true'
        uses: $/.github/actions/rust-toolchain
        with:
          targets: aarch64-apple-ios-sim
      - if: steps.restore.outputs.cache-hit != 'true'
        run: scripts/build-xcframework.sh --sim-only
      - if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-ios-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}

  # Full double build of every target, on demand.
  repro:
    name: double build (all targets)
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    uses: $/.github/workflows/repro-build.yml
    with:
      ref: ${{ github.sha }}
