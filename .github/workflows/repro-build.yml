name: repro-build

# Reusable double build: every published target is built twice (copies a and b, on separate runners),
# the copies are compared byte by byte and the release files (binaries plus a merged SHA256SUMS) are
# uploaded as the "release-files" artifact. Called by ci.yml (on demand) and release.yml (tags).
on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build (a commit SHA or refs/tags/<tag>).
        type: string
        required: true
      retention-days:
        description: Days the build and release artifacts are kept.
        type: number
        default: 3

permissions: {}

jobs:
  build:
    name: build ${{ matrix.target }} (${{ matrix.copie }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-26.04, copie: a }
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-26.04, copie: b }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-26.04-arm, copie: a }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-26.04-arm, copie: b }
          - { target: aarch64-apple-darwin, runner: macos-26, copie: a }
          - { target: aarch64-apple-darwin, runner: macos-26, copie: b }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      # The macOS target builds natively with rustup: the pinned compiler is needed
      # (rust-toolchain.toml), installed explicitly rather than through automatic installation.
      - name: Install the pinned Rust toolchain (macOS)
        if: matrix.target == 'aarch64-apple-darwin'
        uses: ./.github/actions/rust-toolchain
        with:
          targets: aarch64-apple-darwin

      - name: Select the pinned Xcode (macOS)
        if: matrix.target == 'aarch64-apple-darwin'
        uses: ./.github/actions/select-xcode
        with:
          runner: ${{ matrix.runner }}

      - name: Reproducible build
        env:
          TARGET: ${{ matrix.target }}
          COPIE: ${{ matrix.copie }}
          REF: ${{ inputs.ref }}
        run: |
          scripts/repro-build.sh --target "$TARGET" --ref "$REF" \
            --out "$RUNNER_TEMP/out-$TARGET-$COPIE"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ matrix.target }}-${{ matrix.copie }}
          path: ${{ runner.temp }}/out-${{ matrix.target }}-${{ matrix.copie }}/
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

  compare:
    name: comparison of the copies
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-*
          path: copies

      - name: Compare copies a and b, merge SHA256SUMS
        run: scripts/compare-copies.sh --copies copies --out release

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: release/
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
