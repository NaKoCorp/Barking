name: release

# Reproducible release: double build per target, byte-by-byte comparison,
# provenance attestation, then draft release (signed afterwards by the maintainer).
on:
  push:
    tags: ['v*']

# Two tag pushes must not step on each other: queue them, do not cancel.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  verifier-tag:
    name: tag and version
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: The tag's commit is in main's history
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          commit="$(git rev-parse --verify "refs/tags/$TAG^{commit}")"
          git rev-parse --verify origin/main >/dev/null \
            || { echo "origin/main not found in the clone" >&2; exit 1; }
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "commit $commit of tag $TAG is not an ancestor of origin/main: release from main" >&2
            exit 1
          fi
          echo "tag $TAG: commit $commit, ancestor of origin/main"

      - name: The tag matches the version of barking-cli and barking-node
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(sed -n 's/^version *= *"\(.*\)"/\1/p' crates/barking-cli/Cargo.toml | head -n1)"
          [ -n "$version" ] || { echo "version not found in crates/barking-cli/Cargo.toml" >&2; exit 1; }
          version_node="$(sed -n 's/^version *= *"\(.*\)"/\1/p' crates/barking-node/Cargo.toml | head -n1)"
          [ -n "$version_node" ] || { echo "version not found in crates/barking-node/Cargo.toml" >&2; exit 1; }
          if [ "$version" != "$version_node" ]; then
            echo "barking-cli ($version) and barking-node ($version_node) must have the same version" >&2
            exit 1
          fi
          if [ "$TAG" != "v$version" ]; then
            echo "tag $TAG does not match version v$version of crates/barking-cli/Cargo.toml and crates/barking-node/Cargo.toml" >&2
            exit 1
          fi

  build:
    name: build ${{ matrix.target }} (${{ matrix.copie }})
    needs: verifier-tag
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04, copie: a }
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04, copie: b }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm, copie: a }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm, copie: b }
          - { target: aarch64-apple-darwin, runner: macos-26, copie: a }
          - { target: aarch64-apple-darwin, runner: macos-26, copie: b }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The macOS target builds natively with rustup: the pinned compiler is needed
      # (rust-toolchain.toml), installed explicitly rather than through automatic installation.
      - name: Install the pinned Rust toolchain (macOS)
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          canal="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          [ -n "$canal" ] || { echo "channel not found in rust-toolchain.toml" >&2; exit 1; }
          rustup toolchain install "$canal" --profile minimal --target aarch64-apple-darwin
          rustup default "$canal"

      # The macOS binary is only reproducible with the same Xcode and the same SDK: those of .xcode-version.
      - name: Select the pinned Xcode (macOS)
        if: matrix.target == 'aarch64-apple-darwin'
        env:
          RUNNER_LABEL: ${{ matrix.runner }}
        run: |
          set -euo pipefail
          runner="$(sed -n 's/^runner=//p' .xcode-version | head -n1)"
          xcode="$(sed -n 's/^xcode=//p' .xcode-version | head -n1)"
          sdk="$(sed -n 's/^sdk=//p' .xcode-version | head -n1)"
          [ -n "$runner" ] && [ -n "$xcode" ] && [ -n "$sdk" ] || { echo ".xcode-version incomplete" >&2; exit 1; }
          [ "$runner" = "$RUNNER_LABEL" ] \
            || { echo "runner $RUNNER_LABEL differs from the one in .xcode-version ($runner)" >&2; exit 1; }
          sudo xcode-select -s "/Applications/Xcode_${xcode}.app"
          reel_xcode="$(xcodebuild -version | sed -n 's/^Xcode //p' | head -n1)"
          reel_sdk="$(xcrun --show-sdk-version)"
          echo "Xcode $reel_xcode, SDK $reel_sdk"
          [ "$reel_xcode" = "$xcode" ] || { echo "Xcode $reel_xcode instead of $xcode" >&2; exit 1; }
          [ "$reel_sdk" = "$sdk" ] || { echo "SDK $reel_sdk instead of $sdk" >&2; exit 1; }

      - name: Reproducible build
        env:
          TARGET: ${{ matrix.target }}
          COPIE: ${{ matrix.copie }}
          TAG: ${{ github.ref_name }}
        run: |
          scripts/repro-build.sh --target "$TARGET" --ref "refs/tags/$TAG" \
            --out "$RUNNER_TEMP/out-$TARGET-$COPIE"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ matrix.target }}-${{ matrix.copie }}
          path: ${{ runner.temp }}/out-${{ matrix.target }}-${{ matrix.copie }}/
          if-no-files-found: error
          retention-days: 7

  compare:
    name: comparison of the copies
    needs: build
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-*
          path: copies

      - name: Compare copies a and b, merge SHA256SUMS
        run: |
          set -euo pipefail
          targets="x86_64-unknown-linux-musl aarch64-unknown-linux-musl aarch64-apple-darwin"
          mkdir release
          for t in $targets; do
            a="copies/build-$t-a"; b="copies/build-$t-b"
            [ -d "$a" ] && [ -d "$b" ] || { echo "missing copies for $t" >&2; exit 1; }
            for prog in barking-cli barking-node; do
              bins_a="$(cd "$a" && ls "$prog"-* 2>/dev/null || true)"
              bins_b="$(cd "$b" && ls "$prog"-* 2>/dev/null || true)"
              [ -n "$bins_a" ] && [ "$(printf '%s\n' "$bins_a" | wc -l)" -eq 1 ] \
                || { echo "there must be exactly one $prog binary for $t (copy a): $bins_a" >&2; exit 1; }
              [ "$bins_a" = "$bins_b" ] \
                || { echo "binary names differ for $t: $bins_a / $bins_b" >&2; exit 1; }
              case "$bins_a" in *"-$t") ;; *) echo "unexpected name for $t: $bins_a" >&2; exit 1 ;; esac
              cmp "$a/$bins_a" "$b/$bins_a" \
                || { echo "the two copies of $t differ ($prog): non-reproducible build" >&2; exit 1; }
              cp "$a/$bins_a" release/
            done
            cmp "$a/SHA256SUMS" "$b/SHA256SUMS" \
              || { echo "the SHA256SUMS of the copies of $t differ" >&2; exit 1; }
            (cd "$a" && sha256sum -c SHA256SUMS)
          done
          chmod 755 release/barking-cli-* release/barking-node-*
          [ "$(find release -maxdepth 1 -type f -name 'barking-cli-*' | wc -l)" -eq 3 ] || { echo "3 barking-cli binaries expected" >&2; exit 1; }
          [ "$(find release -maxdepth 1 -type f -name 'barking-node-*' | wc -l)" -eq 3 ] || { echo "3 barking-node binaries expected" >&2; exit 1; }
          (cd release && sha256sum barking-cli-* barking-node-* | LC_ALL=C sort -k2 > SHA256SUMS && sha256sum -c SHA256SUMS)
          cat release/SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: release/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: attestation and draft
    needs: compare
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag version
        env:
          TAG: ${{ github.ref_name }}
        run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release

      - name: The binaries carry the tag's version
        run: |
          for f in release/barking-cli-* release/barking-node-*; do
            case "$f" in "release/barking-cli-${VERSION}-"*|"release/barking-node-${VERSION}-"*) ;; *) echo "unexpected binary: $f" >&2; exit 1 ;; esac
          done
          (cd release && sha256sum -c SHA256SUMS)

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/barking-cli-*
            release/barking-node-*

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Drafts have no published tag: look for them in the complete list of releases.
          ids="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq '.[] | select(.tag_name == env.TAG) | .id')" \
            || { echo "cannot list existing releases (GitHub API)" >&2; exit 1; }
          if [ -n "$ids" ]; then
            echo "a release $TAG already exists (draft from a previous run?): delete it (gh release delete $TAG) then rerun the workflow" >&2
            exit 1
          fi
          notes="Draft: awaiting the maintainer's signature (\`scripts/sign-release.sh\`)."
          gh release create "$TAG" --draft --verify-tag -R "$GITHUB_REPOSITORY" \
            --title "$TAG" --notes "$notes" \
            release/barking-cli-* release/barking-node-* release/SHA256SUMS
