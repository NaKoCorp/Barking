name: release

# Reproducible release: double build per target, byte-by-byte comparison,
# provenance attestation, then draft release (signed afterwards by the maintainer).
on:
  push:
    tags: ['v*']

# Two tag pushes must not step on each other: queue them, do not cancel.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  verifier-tag:
    name: tag and version
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: The tag's commit is in main's history
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          commit="$(git rev-parse --verify "refs/tags/$TAG^{commit}")"
          git rev-parse --verify origin/main >/dev/null \
            || { echo "origin/main not found in the clone" >&2; exit 1; }
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "commit $commit of tag $TAG is not an ancestor of origin/main: release from main" >&2
            exit 1
          fi
          echo "tag $TAG: commit $commit, ancestor of origin/main"

      - name: The tag matches the workspace version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          . scripts/release-lib.sh
          version="$(version_du_workspace .)"
          if [ "$TAG" != "v$version" ]; then
            echo "tag $TAG does not match the workspace version v$version (Cargo.toml)" >&2
            exit 1
          fi

  repro:
    name: double build
    needs: verifier-tag
    permissions:
      contents: read
    uses: ./.github/workflows/repro-build.yml
    with:
      ref: refs/tags/${{ github.ref_name }}
      retention-days: 7

  publish:
    name: attestation and draft
    needs: repro
    runs-on: ubuntu-26.04
    # Only v* tags may deploy to this environment (repository settings).
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag version
        env:
          TAG: ${{ github.ref_name }}
        run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release

      - name: The binaries carry the tag's version
        run: |
          for f in release/barking-cli-* release/barking-node-* release/barking-push-*; do
            case "$f" in "release/barking-cli-${VERSION}-"*|"release/barking-node-${VERSION}-"*|"release/barking-push-${VERSION}-"*) ;; *) echo "unexpected binary: $f" >&2; exit 1 ;; esac
          done
          (cd release && sha256sum -c SHA256SUMS)

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/barking-cli-*
            release/barking-node-*
            release/barking-push-*

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Drafts have no published tag: look for them in the complete list of releases.
          ids="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq '.[] | select(.tag_name == env.TAG) | .id')" \
            || { echo "cannot list existing releases (GitHub API)" >&2; exit 1; }
          if [ -n "$ids" ]; then
            echo "a release $TAG already exists (draft from a previous run?): delete it (gh release delete $TAG) then rerun the workflow" >&2
            exit 1
          fi
          notes="Draft: awaiting the maintainer's signature (\`scripts/sign-release.sh\`)."
          gh release create "$TAG" --draft --verify-tag -R "$GITHUB_REPOSITORY" \
            --title "$TAG" --notes "$notes" \
            release/barking-cli-* release/barking-node-* release/barking-push-* release/SHA256SUMS
