name: release

# Reproducible release, triggered by the tag that release-please creates when the release pull
# request is merged (docs/RELEASING.md): double build per target, byte-by-byte comparison,
# provenance attestation of the binaries, then the files are attached to the draft release that
# release-please prepared and the release is published. The runtime images are then built from
# those same files, pushed to ghcr.io and attested.
on:
  push:
    tags: ['v*']

# Two tag pushes must not step on each other: queue them, do not cancel.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  verifier-tag:
    name: tag and version
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: The tag's commit is in main's history
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          commit="$(git rev-parse --verify "refs/tags/$TAG^{commit}")"
          git rev-parse --verify origin/main >/dev/null \
            || { echo "origin/main not found in the clone" >&2; exit 1; }
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "commit $commit of tag $TAG is not an ancestor of origin/main: release from main" >&2
            exit 1
          fi
          echo "tag $TAG: commit $commit, ancestor of origin/main"

      - name: The tag matches the workspace version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          . scripts/release-lib.sh
          version="$(version_du_workspace .)"
          if [ "$TAG" != "v$version" ]; then
            echo "tag $TAG does not match the workspace version v$version (Cargo.toml)" >&2
            exit 1
          fi

  repro:
    name: double build
    needs: verifier-tag
    permissions:
      contents: read
    uses: $/.github/workflows/repro-build.yml
    with:
      ref: refs/tags/${{ github.ref_name }}
      retention-days: 7

  publish:
    name: attestation and publication
    needs: repro
    runs-on: ubuntu-26.04
    # Only v* tags may deploy to this environment (repository settings).
    environment: release
    permissions:
      contents: write # attach the files to the release and publish it
      id-token: write # sign the provenance attestation (Sigstore, OIDC)
      attestations: write # record the provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag version
        env:
          TAG: ${{ github.ref_name }}
        run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      # Before anything is attested: a tag pushed by hand has no draft and stops here. On a rerun,
      # the release may already be published (the images failed afterwards): nothing left to do
      # in this job.
      - name: Release state of the tag
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # A draft cannot be looked up by its tag: search the complete list of releases.
          states="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq '.[] | select(.tag_name == env.TAG) | if .draft then "draft" else "published" end')" \
            || { echo "cannot list existing releases (GitHub API)" >&2; exit 1; }
          count="$(printf '%s\n' "$states" | grep -c . || true)"
          if [ "$count" -eq 0 ]; then
            echo "no draft release for $TAG: releases are cut by merging the release pull request (docs/RELEASING.md)" >&2
            exit 1
          fi
          if [ "$count" -gt 1 ]; then
            echo "$count releases exist for $TAG: keep the one created by release-please, delete the others, then rerun the workflow" >&2
            exit 1
          fi
          if [ "$states" = published ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
          echo "release $TAG: $states"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release

      - name: The binaries carry the tag's version
        run: |
          for f in release/barking-cli-* release/barking-node-* release/barking-push-*; do
            case "$f" in "release/barking-cli-${VERSION}-"*|"release/barking-node-${VERSION}-"*|"release/barking-push-${VERSION}-"*) ;; *) echo "unexpected binary: $f" >&2; exit 1 ;; esac
          done
          (cd release && sha256sum -c SHA256SUMS)

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/barking-cli-*
            release/barking-node-*
            release/barking-push-*

      - name: Attach the files and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PUBLISHED: ${{ steps.state.outputs.published }}
        run: |
          set -euo pipefail
          if [ "$PUBLISHED" = true ]; then
            echo "::notice::release $TAG is already published: its files are left untouched"
            exit 0
          fi
          # A previous run may have attached some of the files already: replace them.
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber \
            release/barking-cli-* release/barking-node-* release/barking-push-* release/SHA256SUMS
          gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false

  images:
    name: image ${{ matrix.image }}
    needs: publish
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write # push the image and its attestation to ghcr.io
      id-token: write # sign the provenance attestation (Sigstore, OIDC)
      attestations: write # record the provenance attestation
    strategy:
      fail-fast: false
      matrix:
        image: [node, push]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # The build context: the binaries of both Linux architectures and SHA256SUMS, against
      # which the Dockerfile checks the binary it copies.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # X.Y.Z, X.Y and latest for a release; the full version alone for a pre-release
      # (vX.Y.Z-rc.N), which moves neither X.Y nor latest.
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/nakocorp/barking-${{ matrix.image }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: org.opencontainers.image.licenses=AGPL-3.0-only

      # No emulation: the prepare stage runs on the build platform and only copies the binary
      # of the target architecture. No BuildKit provenance or SBOM: the attestation is the
      # GitHub one, below.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: release
          file: docker/${{ matrix.image }}.Dockerfile
          build-contexts: apk=docker/apk
          build-args: VERSION=${{ steps.version.outputs.version }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          provenance: false
          sbom: false

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/nakocorp/barking-${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
