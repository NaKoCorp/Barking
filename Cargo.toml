[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
license = "AGPL-3.0-only"
# Nothing goes to crates.io (and cargo-deny treats path dependencies of
# unpublished crates as pinned).
publish = false

[workspace.dependencies]
argon2 = "0.6.0"
assert_cmd = "2.2.2"
barking-core = { path = "crates/barking-core" }
barking-dht = { path = "crates/barking-dht" }
barking-net = { path = "crates/barking-net" }
barking-node = { path = "crates/barking-node" }
barking-packet = { path = "crates/barking-packet" }
barking-proto = { path = "crates/barking-proto" }
bip39 = { version = "3.0.0", features = ["zeroize"] }
blake3 = "1.8.7"
chacha20 = { version = "0.10.2", features = ["rng"] }
chacha20poly1305 = "0.11.0"
clap = { version = "4.6.7", features = ["derive"] }
data-encoding = "2.11.1"
ed25519-dalek = { version = "3.0.0", features = ["serde"] }
hex-literal = "1.1.0"
hkdf = "0.13.0"
hmac = "0.13.0"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", default-features = false }
hyper-util = { version = "0.1.21", default-features = false }
libc = "0.2.191"
p256 = { version = "0.14.0", default-features = false }
ml-kem = { version = "0.3.3", features = ["zeroize"] }
postcard = { version = "1.1.3", features = ["alloc"] }
predicates = "3.1.4"
proptest = "1.12.0"
# QUIC: `ring` cryptographic provider everywhere (no aws-lc: no
# cmake or NASM, simpler musl and reproducible build).
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rand = "0.10.3"
rand_core = "0.10.1"
# APNs client: HTTP/2 over rustls with the `ring` provider installed by the
# binary (no aws-lc).
reqwest = { version = "0.13.5", default-features = false }
rcgen = { version = "0.14.10", default-features = false, features = ["ring"] }
rpassword = "7.5.4"
rusqlite = { version = "0.41.0", features = ["bundled-sqlcipher-vendored-openssl"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
rustls-native-certs = "0.8.5"
rustls-webpki = { version = "0.103.14", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
tempfile = "3.20.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false }
tracing = "0.1.44"
# Node logs: text output only, filter by target (no env-filter nor
# ANSI, no `log` bridge).
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "registry"] }
toml = "1.2.1"
# Swift and Kotlin bindings of barking-ffi.
uniffi = "0.32.2"
x25519-dalek = { version = "3.0.0", features = ["static_secrets", "zeroize"] }
zeroize = { version = "1.9.1", features = ["derive"] }

# Argon2id (64 MiB, 3 passes) is too slow without optimization: the CLI tests
# run it on every command.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
# Node key generation (20-bit puzzle, ~1 million attempts) is
# too slow without optimization.
[profile.dev.package.blake3]
opt-level = 3
[profile.dev.package.curve25519-dalek]
opt-level = 3
[profile.dev.package.ed25519-dalek]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3

# Reproducible build (spec §15): a single codegen unit, no partial LTO,
# no symbols (paths and timestamps absent from the binary).
[profile.release]
codegen-units = 1
lto = "fat"
strip = "symbols"
panic = "abort"

# iOS and Android libraries: like release, but panics unwind so that
# barking-ffi can turn them into errors (spec iOS foundations §3.2).
[profile.release-apple]
inherits = "release"
panic = "unwind"
