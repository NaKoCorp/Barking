[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.dependencies]
argon2 = "0.6.0"
assert_cmd = "2.2.2"
barking-core = { path = "crates/barking-core" }
bip39 = "3.0.0"
blake3 = "1.8.7"
chacha20 = { version = "0.10.2", features = ["rng"] }
chacha20poly1305 = "0.11.0"
clap = { version = "4.6.7", features = ["derive"] }
data-encoding = "2.11.1"
ed25519-dalek = "3.0.0"
hex-literal = "1.1.0"
hkdf = "0.13.0"
hmac = "0.13.0"
ml-kem = { version = "0.3.3", features = ["zeroize"] }
postcard = { version = "1.1.3", features = ["alloc"] }
predicates = "3.1.4"
proptest = "1.12.0"
rand = "0.10.3"
rand_core = "0.10.1"
rpassword = "7.5.4"
rusqlite = { version = "0.41.0", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
tempfile = "3.20.0"
thiserror = "2.0.21"
x25519-dalek = { version = "3.0.0", features = ["static_secrets", "zeroize"] }
zeroize = { version = "1.9.1", features = ["derive"] }

# Argon2id (64 Mio, 3 passes) est trop lent sans optimisation : les tests du CLI
# le lancent à chaque commande.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
