[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.dependencies]
argon2 = "0.6.0"
assert_cmd = "2.2.2"
barking-core = { path = "crates/barking-core" }
barking-packet = { path = "crates/barking-packet" }
barking-proto = { path = "crates/barking-proto" }
bip39 = "3.0.0"
blake3 = "1.8.7"
chacha20 = { version = "0.10.2", features = ["rng"] }
chacha20poly1305 = "0.11.0"
clap = { version = "4.6.7", features = ["derive"] }
data-encoding = "2.11.1"
ed25519-dalek = "3.0.0"
hex-literal = "1.1.0"
hkdf = "0.13.0"
hmac = "0.13.0"
ml-kem = { version = "0.3.3", features = ["zeroize"] }
postcard = { version = "1.1.3", features = ["alloc"] }
predicates = "3.1.4"
proptest = "1.12.0"
# QUIC : fournisseur cryptographique `ring` partout (pas d'aws-lc : pas de
# cmake ni de NASM, build musl et reproductible plus simple).
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rand = "0.10.3"
rand_core = "0.10.1"
rcgen = { version = "0.14.10", default-features = false, features = ["ring"] }
rpassword = "7.5.4"
rusqlite = { version = "0.41.0", features = ["bundled-sqlcipher-vendored-openssl"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
rustls-webpki = { version = "0.103.14", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
tempfile = "3.20.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false }
tracing = "0.1.44"
# Journaux du nœud : sortie texte seule, filtre par cible (pas d'env-filter ni
# d'ANSI, pas de pont `log`).
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "registry"] }
toml = "1.1.8"
x25519-dalek = { version = "3.0.0", features = ["static_secrets", "zeroize"] }
zeroize = { version = "1.9.1", features = ["derive"] }

# Argon2id (64 Mio, 3 passes) est trop lent sans optimisation : les tests du CLI
# le lancent à chaque commande.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
# La génération de clé de nœud (puzzle de 20 bits, ~1 million d'essais) est
# trop lente sans optimisation.
[profile.dev.package.blake3]
opt-level = 3
[profile.dev.package.curve25519-dalek]
opt-level = 3
[profile.dev.package.ed25519-dalek]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3

# Build reproductible (spec §15) : un seul module de génération, pas de LTO partiel,
# pas de symboles (chemins et horodatages absents du binaire).
[profile.release]
codegen-units = 1
lto = "fat"
strip = "symbols"
panic = "abort"
